<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>My Pink Portfolio 🌸</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Kanit',sans-serif;
}

body{

    min-height:100vh;

    background:linear-gradient(
        135deg,
        #ffe1ef,
        #fff0f7,
        #ffd1e6
    );

    overflow:hidden;

    cursor:none;

}


/* ---------------- ดาวตามเมาส์ ---------------- */

.star{

    position:absolute;

    color:white;

    font-size:18px;

    pointer-events:none;

    animation:starMove 1s linear forwards;

}

@keyframes starMove{

    from{

        opacity:1;
        transform:scale(1);

    }

    to{

        opacity:0;
        transform:scale(0) translateY(-30px);

    }

}


/* ---------------- ดอกไม้ลอย ---------------- */


.floating{

    position:absolute;

    bottom:-50px;

    font-size:30px;

    animation:float 10s linear infinite;

    opacity:.8;

}


@keyframes float{

    0%{

        transform:
        translateY(0)
        rotate(0deg);

    }

    100%{

        transform:
        translateY(-110vh)
        rotate(360deg);

    }

}


/* ---------------- Navbar ---------------- */


nav{

    position:fixed;

    top:20px;

    left:50%;

    transform:translateX(-50%);

    background:
    rgba(255,255,255,.35);

    backdrop-filter:blur(15px);

    padding:15px 30px;

    border-radius:50px;

    box-shadow:
    0 10px 30px rgba(255,100,160,.2);

    z-index:10;

}


nav a{

    color:#d63384;

    text-decoration:none;

    margin:0 15px;

    transition:.3s;

}


nav a:hover{

    color:#ff4d94;

    text-shadow:
    0 0 10px #ff8fc7;

}


/* ---------------- กล่องหลัก ---------------- */


.container{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

}


.card{

    width:420px;

    padding:40px;

    text-align:center;

    background:
    rgba(255,255,255,.35);

    backdrop-filter:blur(20px);

    border-radius:35px;

    border:
    1px solid rgba(255,255,255,.6);


    box-shadow:

    0 20px 50px rgba(255,105,180,.25);


    transition:.5s;

}


/* การ์ดเด้ง */

.card:hover{

    transform:
    translateY(-15px)
    scale(1.03);

}



/* ---------------- รูปโปรไฟล์ ---------------- */


.profile{

    width:200px;

    height:200px;

    border-radius:50%;

    object-fit:cover;

    border:8px solid white;


    box-shadow:

    0 0 25px #ff9bc7;


    transition:.4s;

}


.profile:hover{

    transform:
    rotate(5deg)
    scale(1.1);

}



/* ---------------- ข้อความ ---------------- */


h1{

    margin-top:20px;

    color:#e75480;

    font-size:38px;

}


h2{

    color:#ff69a6;

    font-weight:400;

}


p{

    color:#777;

    margin-top:15px;

    line-height:1.8;

}



/* ---------------- ปุ่ม ---------------- */


.btn{


    display:inline-block;

    margin-top:25px;

    padding:14px 35px;


    border-radius:40px;


    background:

    linear-gradient(
        45deg,
        #ff85b3,
        #ffb6d9
    );


    color:white;

    text-decoration:none;


    box-shadow:

    0 10px 25px rgba(255,105,180,.3);


    transition:.4s;

}



.btn:hover{

    transform:
    translateY(-5px)
    scale(1.1);


    box-shadow:

    0 15px 35px rgba(255,105,180,.5);

}


/* ---------------- ไอคอนน่ารัก ---------------- */


.icon{

    font-size:35px;

    margin:10px;

    animation:bounce 2s infinite;

}


@keyframes bounce{

    50%{

        transform:translateY(-10px);

    }

}


</style>

</head>


<body>

<script>


// ดาวตามเมาส์

document.addEventListener(
"mousemove",
function(e){


let star=document.createElement("div");


star.className="star";


star.innerHTML="✦";


star.style.left=e.pageX+"px";

star.style.top=e.pageY+"px";


document.body.appendChild(star);



setTimeout(()=>{

star.remove();

},1000);



}

);


</script>
