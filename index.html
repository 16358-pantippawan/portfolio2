<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Kanit',sans-serif;
}

body{

min-height:100vh;

background:linear-gradient(135deg,#FFE4F1,#FFD6EA,#FFF4F8);

overflow:hidden;

}

/* พื้นหลัง */

.circle1{

position:absolute;

width:300px;
height:300px;

background:#ffc2de;

border-radius:50%;

top:-100px;
left:-80px;

filter:blur(50px);

opacity:.6;

}

.circle2{

position:absolute;

width:250px;
height:250px;

background:#ffd9ec;

border-radius:50%;

right:-80px;
bottom:-80px;

filter:blur(50px);

opacity:.6;

}

/* Navbar */

nav{

position:fixed;

top:20px;

left:50%;

transform:translateX(-50%);

width:90%;

max-width:1100px;

padding:15px 30px;

display:flex;

justify-content:space-between;

align-items:center;

background:rgba(255,255,255,.35);

backdrop-filter:blur(18px);

border-radius:50px;

box-shadow:0 8px 25px rgba(255,105,180,.15);

}

.logo{

font-size:28px;

font-weight:bold;

color:#ff5c9e;

}

nav ul{

display:flex;

gap:25px;

list-style:none;

}

nav a{

text-decoration:none;

color:#d63384;

padding:10px 18px;

border-radius:30px;

transition:.35s;

font-weight:500;

}

nav a:hover{

background:#ff8fbc;

color:white;

transform:translateY(-3px);

}

/* Hero */

.hero{

display:flex;

justify-content:center;

align-items:center;

height:100vh;

padding-top:80px;

}

.card{

width:420px;

padding:40px;

text-align:center;

background:rgba(255,255,255,.30);

backdrop-filter:blur(20px);

border-radius:30px;

box-shadow:0 20px 40px rgba(255,105,180,.25);

animation:fade 1s;

}

/* รูป */

.profile{

width:200px;

height:200px;

border-radius:50%;

object-fit:cover;

border:6px solid white;

box-shadow:0 10px 30px rgba(255,105,180,.35);

transition:.4s;

}

.profile:hover{

transform:scale(1.08);

}

/* ข้อความ */

h1{

margin-top:25px;

color:#e75480;

font-size:38px;

}

h2{

margin-top:10px;

font-weight:400;

color:#ff79ac;

}

p{

margin-top:20px;

line-height:1.8;

color:#666;

}

/* ปุ่ม */

.btn{

display:inline-block;

margin-top:30px;

padding:14px 35px;

border-radius:40px;

background:#ff85b5;

color:white;

text-decoration:none;

font-size:18px;

transition:.35s;

box-shadow:0 10px 20px rgba(255,105,180,.3);

}

.btn:hover{

background:#ff5c9e;

transform:translateY(-5px);

box-shadow:0 15px 25px rgba(255,105,180,.4);

}

/* Animation */

@keyframes fade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}

footer{

position:absolute;

bottom:20px;

width:100%;

text-align:center;

color:#d63384;

}

/* มือถือ */

@media(max-width:768px){

nav{

flex-direction:column;

gap:15px;

}

nav ul{

flex-wrap:wrap;

justify-content:center;

}

.card{

width:90%;

}

.profile{

width:170px;

height:170px;

}

}

</style>

</head>

<body>

<div class="circle1"></div>
<div class="circle2"></div>

<nav>

<div class="logo">🌸 Portfolio</div>

<ul>

<li><a href="index.html">หน้าหลัก</a></li>

<li><a href="about.html">ประวัติส่วนตัว</a></li>

<li><a href="education.html">การศึกษา</a></li>

<li><a href="projects.html">ผลงาน</a></li>

<li><a href="contact.html">ติดต่อ</a></li>

</ul>

</nav>

<section class="hero">

<div class="card">

<img src="images/profile.jpg" class="profile">

<h1>สวัสดีค่ะ 👋</h1>

<h2>ทิพวรรณ ดวงทำ</h2>

<p>

ยินดีต้อนรับสู่เว็บไซต์ Portfolio ของฉัน

<br>

นักเรียนชั้นมัธยมศึกษาปีที่ 6

<br>

ยินดีที่ได้รู้จักทุกคนค่ะ 💖

</p>

<a href="about.html" class="btn">รู้จักฉันเพิ่มเติม</a>

</div>

</section>

<footer>

Made with 💗 by Your Name

</footer>

</body>
</html>
