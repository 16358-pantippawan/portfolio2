<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio | ทิพวรรณ ดวงทำ</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Arial", sans-serif;
        }

        body {
            background-color: #fff5f8;
            color: #5a3d46;
        }

        /* เมนูด้านบน */
        nav {
            background-color: #f8b6c8;
            padding: 18px 0;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        nav a:hover {
            color: #8e5266;
        }

        /* ส่วนหน้าหลัก */
        .home {
            min-height: calc(100vh - 65px);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            position: relative;
            overflow: hidden;
        }

        /* วงกลมตกแต่ง */
        .circle {
            position: absolute;
            border-radius: 50%;
            z-index: 0;
        }

        .circle1 {
            width: 180px;
            height: 180px;
            background-color: #ffd6e2;
            top: 50px;
            left: 5%;
        }

        .circle2 {
            width: 130px;
            height: 130px;
            background-color: #f9c4d5;
            bottom: 50px;
            right: 8%;
        }

        .circle3 {
            width: 80px;
            height: 80px;
            background-color: #ffe5ed;
            top: 25%;
            right: 15%;
        }

        .content {
            position: relative;
            z-index: 1;
        }

        /* รูปโปรไฟล์ */
        .profile-img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 50%;
            border: 8px solid white;
            box-shadow: 0 8px 25px rgba(220, 120, 150, 0.25);
            margin-bottom: 25px;
        }

        /* ข้อความ */
        h1 {
            font-size: 40px;
            color: #d96b91;
            margin-bottom: 12px;
        }

        .nickname {
            font-size: 20px;
            color: #a85c76;
            margin-bottom: 15px;
        }

        .description {
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        /* ปุ่ม */
        .button {
            display: inline-block;
            background-color: #e889a8;
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 5px 12px rgba(220, 120, 150, 0.25);
            transition: 0.3s;
        }

        .button:hover {
            background-color: #d96b91;
            transform: translateY(-3px);
        }

        /* Footer */
        footer {
            background-color: #f8b6c8;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 14px;
        }

        /* รองรับมือถือ */
        @media (max-width: 600px) {

            nav a {
                margin: 5px;
                font-size: 13px;
            }

            .profile-img {
                width: 170px;
                height: 170px;
            }

            h1 {
                font-size: 30px;
            }

            .description {
                font-size: 16px;
            }

            .circle1 {
                width: 100px;
                height: 100px;
            }

            .circle2 {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>

<body>

    <!-- เมนู -->
    <nav>
        <a href="index.html">หน้าแรก</a>
        <a href="about.html">ประวัติส่วนตัว</a>
        <a href="education.html">การศึกษา</a>
        <a href="portfolio.html">ผลงาน</a>
        <a href="contact.html">ติดต่อ</a>
    </nav>

    <!-- หน้าหลัก -->
    <section class="home">

        <!-- วงกลมตกแต่ง -->
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
        <div class="circle circle3"></div>

        <div class="content">

            <!-- รูปโปรไฟล์ -->
            <!-- เปลี่ยน profile.jpg เป็นชื่อไฟล์รูปของตัวเอง -->
            <img src="images/profile.jpg"
                 alt="รูปโปรไฟล์ ทิพวรรณ ดวงทำ"
                 class="profile-img">

            <h1>ทิพวรรณ ดวงทำ</h1>

            <p class="nickname">
                ✿ นักเรียนชั้นมัธยมศึกษาปีที่ 6 ✿
            </p>

            <p class="description">
                แผนการเรียนวิทยาศาสตร์ - คณิตศาสตร์<br>
                โรงเรียนพานทอง
            </p>

            <a href="about.html" class="button">
                รู้จักฉันเพิ่มเติม ♡
            </a>

        </div>
    </section>

    <!-- Footer -->
    <footer>
        © 2026 Thipwan Duangtham | My Portfolio ♡
    </footer>

</body>
</html>
