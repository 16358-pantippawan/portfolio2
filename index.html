<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio | Home</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Kanit',sans-serif;
}

body{

    min-height:100vh;

    background:linear-gradient(135deg,#FFE6F0,#FFDDEE,#FFF4F8);

    overflow-x:hidden;

}

/* ---------- พื้นหลังตกแต่ง ---------- */

body::before{

content:"";

position:fixed;

width:350px;
height:350px;

background:#ffb6d5;

border-radius:50%;

top:-120px;
left:-100px;

opacity:.4;

filter:blur(80px);

}

body::after{

content:"";

position:fixed;

width:350px;
height:350px;

background:#ffc9e3;

border-radius:50%;

right:-100px;
bottom:-100px;

opacity:.5;

filter:blur(80px);

}

/* ---------- เมนู ---------- */

nav{

position:fixed;

top:20px;
left:50%;

transform:translateX(-50%);

width:90%;

max-width:1100px;

padding:15px 35px;

display:flex;

justify-content:space-between;

align-items:center;

background:rgba(255,255,255,.35);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.5);

border-radius:50px;

box-shadow:0 10px 25px rgba(255,105,180,.15);

z-index:1000;

}

.logo{

font-size:28px;

font-weight:bold;

color:#e75480;

}

nav ul{

display:flex;

list-style:none;

gap:30px;

}

nav ul li a{

text-decoration:none;

color:#d63384;

font-weight:500;

transition:.35s;

padding:8px 15px;

border-radius:30px;

}

nav ul li a:hover{

background:#ffb6d5;

color:white;

transform:translateY(-2px);

}

/* ---------- Hero ---------- */

.hero{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding-top:80px;

}

.card{

width:420px;

padding:45px;

text-align:center;

background:rgba(255,255,255,.28);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.5);

border-radius:30px;

box-shadow:0 20px 40px rgba(255,105,180,.2);

animation:fadeUp 1s;

}

/* ---------- รูป ---------- */

.profile{

width:220px;

height:220px;

border-radius:50%;

object-fit:cover;

border:7px solid white;

box-shadow:0 15px 35px rgba(255,105,180,.35);

transition:.4s;

}

.profile:hover{

transform:scale(1.05) rotate(2deg);

}

/* ---------- ข้อความ ---------- */

h1{

margin-top:25px;

font-size:40px;

color:#e75480;

}

h2{

margin-top:8px;

font-weight:400;

color:#ff6fa8;

}

p{

margin-top:20px;

font-size:17px;

line-height:1.8;

color:#666;

}

/* ---------- ปุ่ม ---------- */

.btn{

display:inline-block;

margin-top:30px;

padding:14px 38px;

background:linear-gradient(45deg,#ff7eb6,#ff99c8);

color:white;

text-decoration:none;

border-radius:40px;

font-size:18px;

transition:.35s;

box-shadow:0 10px 25px rgba(255,105,180,.3);

}

.btn:hover{

transform:translateY(-5px) scale(1.05);

box-shadow:0 15px 30px rgba(255,105,180,.45);

}

/* ---------- Animation ---------- */

@keyframes fadeUp{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

footer{

text-align:center;

padding:20px;

color:#d63384;

font-size:15px;

}

@media(max-width:768px){

nav{

flex-direction:column;

gap:15px;

padding:20px;

}

nav ul{

flex-wrap:wrap;

justify-content:center;

gap:15px;

}

.card{

width:90%;

}

.profile{

width:180px;

height:180px;

}

h1{

font-size:32px;

}

}

</style>

</head>

<body>

<nav>

<div class="logo">🌸 Portfolio</div>

<ul>

<li><a href="projects.html">ผลงาน</a></li>

<li><a href="contact.html">ติดต่อ</a></li>

</ul>

</nav>

<section class="hero">

<div class="card">

<img src="images/profile.jpg" alt="Profile" class="profile">

<h1>สวัสดีค่ะ 👋</h1>

<h2>ชื่อ - นามสกุล</h2>

<p>

ยินดีต้อนรับสู่เว็บไซต์ Portfolio ของฉัน

<br>

นักเรียนชั้นมัธยมศึกษาปีที่ 6

<br>

มีความสนใจด้านการพัฒนาเว็บไซต์ การออกแบบ และการเขียนโปรแกรม

</p>

<a href="about.html" class="btn">รู้จักฉันเพิ่มเติม</a>

</div>

</section>

<footer>

© 2026 My Portfolio | Made with 💖

</footer>

</body>
</html>
